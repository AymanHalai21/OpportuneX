# One command:   docker-compose up --build      (or: docker compose up --build)
# Then open:     http://localhost:3000          demo login: arjun@iitd.ac.in / password123
services:
  mysql:
    image: mysql:8
    # utf8mb4 for emoji badges; trust-function-creators lets the app create the optional triggers
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pw}
      MYSQL_DATABASE: opportunex
      MYSQL_USER: opportunex
      MYSQL_PASSWORD: ${DB_PASSWORD:-opportunex_pw}
    ports:
      # change the left number (e.g. MYSQL_HOST_PORT=3307) if a MySQL is already running on your PC
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # inside the compose network the database is reached by its SERVICE NAME (mysql), not localhost
      DB_URL: jdbc:mysql://mysql:3306/opportunex?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: opportunex
      DB_PASSWORD: ${DB_PASSWORD:-opportunex_pw}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production-please-1234}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
